#     - name: "Atmaja Gerai (full memory)"
#       apiKey: "${GERAI_BEARER_TOKEN}"
#       baseURL: "https://gerai.mahewwork.com/api/v1"
#       models:
#         default: ["atmaja-opus-4.7", "atmaja-sonnet-4.6"]
#         fetch: false

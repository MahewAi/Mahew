visual_identity:
  palette_name: "The Timeless Foundation"
  colors:
    brass_gold:
      hex: "#B8956B"
      rgb: [184, 149, 107]
      role: "Signature accent. Logo, CTA premium, frame highlight, brand pillar divider."
      max_coverage_per_layout: "20% — stay refined, jangan loud"
    deep_charcoal:
      hex: "#1F1A14"
      rgb: [31, 26, 20]
      role: "Authority base. Heading utama, body teks panjang, frame dasar slide."
      note: "Bukan hitam pekat. Ada warmth dari undertone coklat."
    warm_ivory:
      hex: "#FAF8F4"
      rgb: [250, 248, 244]
      role: "Clean support. Background utama, breathing space, contrast plate."
      note: "Bukan putih klinis. Ada warmth supaya selaras dengan Brass + Charcoal."
  core_pairing: "Brass gold + Deep charcoal sebagai pasangan signature. Warm ivory sebagai breathable support."
  ratio_standard: "Charcoal 60% + Ivory 30% + Brass 10% adalah rasio standar premium feel"
  typography:
    display_heading:
      font: "Playfair Display atau EB Garamond (serif klasik)"
      weight: 700
      color: deep_charcoal
    body:
      font: "Inter atau Manrope (sans-serif clean)"
      weight: 400
      color: deep_charcoal
    accent:
      style: "Serif italic atau small caps"
      color: brass_gold
      usage: "Pillar, CTA, divider, signature element"
  photography_style:
    do:
      - "Natural daylight"
      - "Minimal artificial flash"
      - "Framing tight pada detail material (urat kayu, finishing tekstur, brass handle close-up)"
      - "Subject pintu sebagai hero"
    do_not:
      - "Wide-shot interior cluttered"
      - "Subject pintu sebagai accessory"

writing_canon:
  language_primary: "Bahasa Indonesia (formal-casual, tone calm refined)"
  language_secondary: "English (technical doc, international communication)"
  tone: "Calm refined premium curated. Bukan flashy, bukan urgensi artifisial. Confident, decisive, warm."

  hard_rules:
    - rule: "NO em-dash"
      severity: critical
      note: "Pakai koma, titik, dash biasa (-), atau restrukturisasi kalimat. Em-dash (—) DILARANG di semua copy dan internal output."

    - rule: "Pakai 'tempat' bukan 'rumah'"
      severity: critical
      note: "Tempat = lebih inklusif (residential, project, office, retail). 'Rumah' terlalu domestik, menyempitkan positioning. Exception: konteks spesifik 'rumah tinggal' kalau benar-benar harus."

    - rule: "Sebut 'Gerai 1000 Pintu' lengkap"
      severity: critical
      note: "Jangan singkat jadi 'Gerai', 'G1P', '1000 Pintu' saja. Konsistensi nama brand penting untuk positioning premium."

    - rule: "Tidak ada bahasa diskon-marketing"
      severity: high
      note: "Hindari kata 'murah meriah', 'promo gila', 'diskon besar', 'serbu', exclamation marks berlebihan. Premium tone = confident pricing."

    - rule: "Tidak ada cliché generic"
      severity: medium
      note: "Hindari 'gaya hidup modern', 'kualitas premium tanpa kompromi', 'pengalaman tak terlupakan'. Generic = melemahkan positioning."

  preferred_phrasing:
    - prefer: "membangun ruang Anda"
      avoid: "mendekor rumah baru"
    - prefer: "pernyataan tentang siapa Anda"
      avoid: "gaya hidup modern"
    - prefer: "kurasi yang dipikirkan"
      avoid: "produk premium tanpa kompromi"
    - prefer: "lead time 21 hari"
      avoid: "express delivery"

  signature_phrases:
    - "Pintu bukan sekadar batas ruang, melainkan pernyataan tentang siapa Anda."
    - "Setiap pintu di Gerai 1000 Pintu adalah hasil kurasi yang dipikirkan."
    - "Membawa Balikpapan ke titik di mana pintu menjadi pengantar identitas."


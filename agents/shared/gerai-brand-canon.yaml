  legal_entity: PT (to be confirmed)
  location: Balikpapan, Kalimantan Timur, Indonesia
  category: Premium curated retail
  product: Pintu kayu solid + finishing premium
  philosophy: |
    Filosofi 4-dunia (Dunia Pintu Indonesia):
    - Jepang: pintu sebagai jiwa rumah (wabi-sabi, kebersihan, disiplin material)
    - Eropa: pintu sebagai karya seni (kerajinan, ornamen, narasi sejarah)
    - Amerika: pintu sebagai pernyataan diri (statement, signature, identity)
    - China: pintu sebagai gerbang rezeki (filosofi feng shui, hierarki, prosperity)

